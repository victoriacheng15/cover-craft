openapi: 3.0.3
info:
  title: Cover Craft API
  description: API contract for the Cover Craft image generation and analytics platform.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:7071/api
    description: Local Azure Functions v2 Handler (Go)
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the status and local/ISO timestamps.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    post:
      summary: Collect telemetry and usage metrics
      description: Stores performance and WCAG compliance data to MongoDB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPayload'
      responses:
        '200':
          description: Metric captured successfully
        '400':
          description: Invalid metrics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analytics:
    get:
      summary: Fetch analytics trends
      description: Aggregates historical metrics for Feature Popularity, User Engagement, Accessibility Compliance, and Performance.
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResult'

  /generateImage:
    post:
      summary: Generate a single cover image
      description: Renders a custom PNG cover using the canvas engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageParams'
      responses:
        '200':
          description: Rendered PNG cover image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Validation failed (e.g. low contrast, invalid size, too long text)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal rendering or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generateGif:
    post:
      summary: Generate an animated GIF slideshow
      description: Renders a multi-frame animated GIF cover sequence using the pure-Go canvas engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GifParams'
      responses:
        '200':
          description: Rendered animated GIF slideshow
          content:
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          description: Validation failed (e.g. less than 2 slides, low contrast, invalid size)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal rendering error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /generateCarousel:
    post:
      summary: Submit a carousel generation job
      description: Enqueues a carousel deck to be rendered into a multi-page PDF and PNG archive asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarouselParams'
      responses:
        '202':
          description: Carousel job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique Job ID for status polling.
                required:
                  - id
        '400':
          description: Carousel validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /getJobStatus:
    get:
      summary: Poll status of a bulk generation batch
      description: Returns progress counter, enqueued time, and completed image URLs for a batch Job ID.
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current status of the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '400':
          description: Missing jobId query parameter
        '444':
          description: Job ID not found

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          properties:
            localTime:
              type: string
            isoTime:
              type: string
          required:
            - localTime
            - isoTime
      required:
        - status
        - timestamp
        - data

    ImageParams:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 1400
          example: 1200
        height:
          type: integer
          minimum: 1
          maximum: 1400
          example: 627
        backgroundColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          example: '#374151'
        textColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          example: '#F9FAFB'
        font:
          type: string
          enum: [Montserrat, Roboto, Lato, Playfair Display, Open Sans]
          example: Montserrat
        title:
          type: string
          maxLength: 40
          example: Welcome
        subtitle:
          type: string
          maxLength: 70
          example: Cover Craft
        hasBorder:
          type: boolean
          description: Whether to render an inset border around the cover (defaults to false)
          example: false
        filename:
          type: string
          example: cover
      required:
        - width
        - height
        - backgroundColor
        - textColor
        - font
        - title
        - filename

    GifSlideParams:
      type: object
      properties:
        title:
          type: string
          maxLength: 40
          example: Welcome
        subtitle:
          type: string
          maxLength: 70
          example: Cover Craft
        font:
          type: string
          enum: [Montserrat, Roboto, Lato, Playfair Display, Open Sans]
          example: Montserrat
        textColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          description: Slide text color. If omitted, a random WCAG AA compliant color is generated.
          example: '#F9FAFB'
        hasBorder:
          type: boolean
          description: Whether to render an inset border around the slide (defaults to false)
          example: false
      required:
        - title
        - font

    GifParams:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 1400
          example: 1200
        height:
          type: integer
          minimum: 1
          maximum: 1400
          example: 627
        backgroundColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          example: '#374151'
        delayMs:
          type: integer
          enum: [1000, 1500, 2000, 3000]
          default: 1500
          example: 1500
        slides:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/GifSlideParams'
        filename:
          type: string
          example: slideshow
      required:
        - width
        - height
        - backgroundColor
        - slides

    CarouselSlideParams:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
          example: Building Scalable Systems
        subtitle:
          type: string
          maxLength: 120
          description: Optional paragraph or subtitle commentary
          example: Architectural principles for high-throughput distributed systems.
        listItems:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: string
            maxLength: 70
          description: Optional bulleted or numbered list items
          example:
            - Design for horizontal scalability
            - Decouple compute from storage
            - Enforce strict API contracts
        textAlign:
          type: string
          enum: [left, center, right]
          default: left
          example: left
        verticalAlign:
          type: string
          enum: [top, center, bottom]
          default: top
          example: top
        backgroundColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          description: Slide background color override. If omitted, uses deck backgroundColor.
          example: '#1E293B'
        textColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          description: Slide text color override. If omitted, uses deck textColor.
          example: '#F8FAFC'
      required:
        - title

    CarouselParams:
      type: object
      properties:
        width:
          type: integer
          minimum: 1
          maximum: 1400
          example: 1080
        height:
          type: integer
          minimum: 1
          maximum: 1400
          example: 1350
        backgroundColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          example: '#0F172A'
        textColor:
          type: string
          pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          example: '#F8FAFC'
        font:
          type: string
          enum: [Montserrat, Roboto, Lato, Playfair Display, Open Sans]
          example: Montserrat
        borderStyle:
          type: string
          enum: [none, single, double]
          default: none
          example: single
        authorHandle:
          type: string
          maxLength: 30
          example: '@username'
        authorHandlePosition:
          type: string
          enum: [bottom-left, bottom-right, top-left, top-right]
          default: bottom-left
          example: bottom-left
        showSlideNumbers:
          type: boolean
          default: true
          example: true
        slideNumberPosition:
          type: string
          enum: [top-right, bottom-right, top-left, bottom-left]
          default: top-right
          example: top-right
        slides:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/CarouselSlideParams'
        filename:
          type: string
          maxLength: 50
          example: carousel
      required:
        - width
        - height
        - backgroundColor
        - textColor
        - font
        - slides

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: width
        message:
          type: string
          example: Width must be between 1 and 1400
      required:
        - field
        - message

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      required:
        - error
        - details

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Internal server error
      required:
        - error

    MetricPayload:
      type: object
      properties:
        event:
          type: string
          example: image_generated
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, error, validation_error]
        errorMessage:
          type: string
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
          required:
            - width
            - height
        font:
          type: string
        hasBorder:
          type: boolean
        borderStyle:
          type: string
        titleLength:
          type: integer
        subtitleLength:
          type: integer
        contrastRatio:
          type: number
        wcagLevel:
          type: string
          enum: [AAA, AA, FAIL]
        duration:
          type: integer
        clientDuration:
          type: integer
        slideCount:
          type: integer
        compileDuration:
          type: integer
        fileSizeBytes:
          type: integer
      required:
        - event
        - timestamp
        - status

    JobStatusResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: integer
        total:
          type: integer
        results:
          type: array
          items:
            type: string
        pdfUrl:
          type: string
          description: Base64 data URL or storage URL for the compiled carousel PDF document
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - progress
        - total
        - results
        - createdAt
        - updatedAt

    AnalyticsResult:
      type: object
      description: Dashboard analytics details (feature popularity, accessibility, engagement)
      properties:
        userEngagement:
          type: object
        featurePopularity:
          type: object
        accessibilityCompliance:
          type: object
        performanceMetrics:
          type: object
      required:
        - userEngagement
        - featurePopularity
        - accessibilityCompliance
        - performanceMetrics
