name: Infrastructure & Code Deployment

on:
  push:
    branches: [main]
    paths:
      - 'tofu/**'
      - 'apiv2/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: 'projects-rg'
  API_RESOURCE_GROUP: 'projects-rg-api'
  NODE_VERSION: '22'
  GO_VERSION: '1.26'
  FRONTEND_APP_NAME: 'cover-craft-ui'
  API_APP_NAME: 'cover-craft'
  GO_API_APP_NAME: 'cover-craft-go-api'

jobs:
  infra-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.6.0

      - name: Tofu Init
        working-directory: tofu
        run: tofu init
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

      - name: Tofu Apply
        working-directory: tofu
        run: tofu apply -auto-approve -var="mongodb_uri=${{ secrets.MONGODB_URI }}"
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

  deploy-go-api:
    needs: infra-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum

      - name: Build Go binary
        working-directory: apiv2
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/apiv2-handler cmd/handler/main.go

      - name: Package Go API for deployment
        working-directory: apiv2
        run: |
          zip -r ../go-deploy.zip bin host.json handler processJobs assets

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Go API to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.GO_API_APP_NAME }}
          package: go-deploy.zip

  deploy-frontend:
    needs: infra-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install all dependencies
        working-directory: frontend
        run: npm ci
        env:
          NODE_ENV: development

      - name: Build Frontend (Standalone)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package Frontend
        run: |
          # Copy public and static assets directly into the standalone directory structure
          cp -r frontend/public frontend/.next/standalone/
          cp -r frontend/.next/static frontend/.next/standalone/.next/
          
          # Zip the standalone folder
          cd frontend/.next/standalone
          zip -r ../../../frontend-deploy.zip .

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          package: frontend-deploy.zip
          startup-command: "node frontend/server.js"
