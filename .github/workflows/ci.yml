name: Continuous Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'apiv2/**'
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'apiv2/**'
      - '**/*.md'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  GO_VERSION: '1.26'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apiv2: ${{ steps.filter.outputs.apiv2 }}
      frontend: ${{ steps.filter.outputs.frontend }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apiv2:
              - 'apiv2/**'
            frontend:
              - 'frontend/**'
            markdown:
              - '**/*.md'

  lint-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit

  lint-apiv2:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.apiv2 == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum
      - name: Run Go Lint (Vet)
        run: |
          make lint-go

  markdownlint:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run markdownlint
        run: npx markdownlint-cli "**/*.md" --ignore "**/node_modules/**"

  test-apiv2:
    runs-on: ubuntu-latest
    needs: [changes, lint-apiv2]
    if: ${{ needs.changes.outputs.apiv2 == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum
      - name: Run Go Tests
        run: |
          make test-go

  test-bdd-apiv2:
    runs-on: ubuntu-latest
    needs: [changes, lint-apiv2]
    if: ${{ needs.changes.outputs.apiv2 == 'true' }}
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum
      - name: Run Go BDD Tests
        run: |
          make test-bdd

  test-frontend:
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run test