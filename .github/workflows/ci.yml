name: Continuous Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'apiv2/**'
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'apiv2/**'
      - '**/*.md'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  GO_VERSION: '1.26'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apiv2: ${{ steps.filter.outputs.apiv2 }}
      frontend: ${{ steps.filter.outputs.frontend }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apiv2:
              - 'apiv2/**'
            frontend:
              - 'frontend/**'
            markdown:
              - '**/*.md'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.apiv2 == 'true' || needs.changes.outputs.markdown == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum

      - name: Run frontend lint and typecheck
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Run markdownlint
        if: ${{ needs.changes.outputs.markdown == 'true' }}
        run: make lint-md

      - name: Run Go Lint (Vet)
        if: ${{ needs.changes.outputs.apiv2 == 'true' }}
        run: make lint-go

  test:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.apiv2 == 'true' }}
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apiv2/go.sum

      - name: Run frontend tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: frontend
        run: |
          npm ci
          npm run test

      - name: Run Go Tests
        if: ${{ needs.changes.outputs.apiv2 == 'true' }}
        run: make test-go

      - name: Run Go BDD Tests
        if: ${{ needs.changes.outputs.apiv2 == 'true' }}
        run: make test-bdd